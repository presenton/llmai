[project]
name = "llmai"
version = "0.3.5"
description = "Unified Python client for OpenAI, Azure OpenAI, Vertex AI, Anthropic, Gemini, DeepSeek, OpenRouter, Cerebras, Fireworks, Together AI, LM Studio, Bedrock, LiteLLM, and ChatGPT."
readme = "README.md"
authors = [{ name = "sauravniraula", email = "saurav@presenton.ai" }, { name = "sudipnext", email = "sudip@presenton.ai" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = [
    "anthropic>=0.79.0",
    "boto3>=1.42.89",
    "google-genai>=1.62.0",
    "httpx>=0.28.1",
    "openai>=2.18.0",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llmai"
module-root = ""

[tool.pyright]
typeCheckingMode = "off"
